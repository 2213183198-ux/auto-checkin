name: Auto Checkin

on:
  schedule:
    - cron: '0 0 * * *'  # 每天北京时间8点（UTC 0点）
  workflow_dispatch:  # 允许手动触发

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install requests
      - run: python auto_checkin.py
